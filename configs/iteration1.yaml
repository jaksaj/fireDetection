# Iteration 1: Binary Classification (Fire vs. Normal)
# Random seed for reproducibility. Override per-run with --seed.
seed: 42
data:
  root_dir: data
  train_split: train
  val_split: val
  test_split: test
  fire_class_id: 1        # D-Fire YOLO: 0 = smoke, 1 = fire
  image_size: 224
  batch_size: 32
  num_workers: 10

model:
  in_channels: 3
  num_conv_blocks: 4
  base_channels: 32

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  checkpoint_dir: checkpoints/iteration1
  run_test_after_training: true
  log_every_n_batches: 25

wandb:
  project: smoke-fire-detection
  entity: jaksaj35-university-of-split  # set to your W&B username or team
  run_name: iteration1-binary-cnn
  tags:
    - iteration1
    - binary-classification
    - d-fire
