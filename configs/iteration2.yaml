# Iteration 2: 4-Class Transfer Learning (MobileNetV3-Small)
data:
  root_dir: data
  train_split: train
  val_split: val
  test_split: test
  fire_class_id: 1        # D-Fire YOLO: 0 = smoke, 1 = fire
  smoke_class_id: 0
  image_size: 224
  batch_size: 32
  num_workers: 4
  use_class_weights: true

model:
  name: mobilenet_v3_small
  num_classes: 4
  pretrained: true
  dropout: 0.2

training:
  # Phase 1: frozen backbone, train head only
  head_epochs: 5
  head_learning_rate: 0.001
  # Phase 2: unfreeze top blocks, fine-tune at lower LR
  finetune_epochs: 10
  finetune_learning_rate: 0.0001
  unfreeze_blocks: 3
  weight_decay: 0.0001
  checkpoint_dir: checkpoints/iteration2
  run_test_after_training: true
  log_every_n_batches: 25

wandb:
  project: smoke-fire-detection
  entity: jaksaj35-university-of-split
  run_name: iteration2-mobilenet-multiclass
  tags:
    - iteration2
    - transfer-learning
    - multiclass
    - d-fire
